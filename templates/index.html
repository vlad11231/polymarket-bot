<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bot Debug Dashboard</title>
<style>
body { background:#020617; color:#e5e7eb; font-family:Arial; padding:20px }
pre { background:#020617; border:1px solid #1e293b; padding:15px }
h1 { color:#38bdf8 }
</style>
</head>
<body>

<h1>🧠 Bot Debug Dashboard</h1>

<p>Ultimul update:</p>
<pre id="time"></pre>

<h3>📊 Scoruri piețe</h3>
<pre id="scores"></pre>

<h3>💰 Poziții active</h3>
<pre id="positions"></pre>

<script>
async function load() {
  const d = await fetch("/api/state").then(r=>r.json());
  document.getElementById("time").innerText = d.last_update || "—";
  document.getElementById("scores").innerText = JSON.stringify(d.scores, null, 2);
  document.getElementById("positions").innerText = JSON.stringify(d.positions, null, 2);
}
setInterval(load, 5000);
load();
</script>

</body>
</html>
