<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Polymarket Dashboard</title>
<style>
body { background:#020617; color:#e5e7eb; font-family:Arial; padding:20px }
h1 { color:#38bdf8 }
.box { border:1px solid #1e293b; padding:15px; border-radius:8px; margin-bottom:15px }
</style>
</head>
<body>

<h1>📊 Polymarket Trading Dashboard</h1>

<div class="box">
<h3>🌙 Night Summary</h3>
<pre id="night">Loading...</pre>
</div>

<div class="box">
<h3>📈 State</h3>
<pre id="state">Loading...</pre>
</div>

<script>
async function load() {
  const s = await fetch("/api/state").then(r=>r.json());
  const n = await fetch("/api/night").then(r=>r.json());
  document.getElementById("state").innerText = JSON.stringify(s,null,2);
  document.getElementById("night").innerText = JSON.stringify(n,null,2);
}
setInterval(load, 10000);
load();
</script>

</body>
</html>
